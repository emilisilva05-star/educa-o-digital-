<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Projeto Web</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1>Meu Web App</h1>
    <nav>
      <a href="#card">Início</a>
      <a href="#form">Contato</a>
    </nav>
  </header>

  <main class="container">
    
    <section id="card" class="card">
      <span class="badge">Novo</span>
      <h2>Cartão Interativo</h2>
      <p>Este é um exemplo de cartão estilizado. Passe o mouse por cima para ver o efeito de elevação!</p>
      <button class="btn-primary">Saber mais</button>
    </section>

    <section id="form" class="card">
      <h2>Fale Conosco</h2>
      <form class="form-group">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" placeholder="Digite seu nome">
        
        <label for="email">E-mail:</label>
        <input type="email" id="email" placeholder="seu@email.com">
        
        <button type="submit" class="btn-primary">Enviar Mensagem</button>
      </form>
    </section>

  </main>

  <footer class="footer">
    <p>&copy; 2026 - Criado com HTML e CSS.</p>
  </footer>

</body>
</html>
